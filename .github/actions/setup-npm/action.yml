name: Set up the declared npm version
description: Install npm into a separate runner prefix without replacing the running package manager.

runs:
  using: composite
  steps:
    - name: Install npm into an isolated prefix
      shell: bash
      run: |
        package_manager="$(node -p "require('./package.json').packageManager")"
        npm install --global --prefix "$RUNNER_TEMP/dockline-npm" --ignore-scripts --no-audit --no-fund "$package_manager"
        printf '%s\n' "$RUNNER_TEMP/dockline-npm" "$RUNNER_TEMP/dockline-npm/bin" >> "$GITHUB_PATH"
    - name: Verify the selected npm version
      shell: bash
      run: |
        expected_version="$(node -p "require('./package.json').packageManager.replace(/^npm@/, '')")"
        actual_version="$(npm --version)"
        test "$actual_version" = "$expected_version"
        printf 'Using npm %s\n' "$actual_version"
